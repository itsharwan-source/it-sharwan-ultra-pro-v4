<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IT-SHARWAN</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #111827, #1e293b);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .app {
      width: 100%;
      max-width: 1100px;
      height: 92vh;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 320px 1fr;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    .sidebar {
      border-right: 1px solid rgba(255,255,255,0.08);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: rgba(0,0,0,0.12);
    }
    .brand {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #22c55e;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 14px;
    }
    .card h3 { margin-bottom: 10px; font-size: 15px; }
    .input, .btn, textarea {
      width: 100%;
      border: none;
      outline: none;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
    }
    .input, textarea {
      background: rgba(255,255,255,0.08);
      color: #fff;
      margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.6); }
    .btn {
      cursor: pointer;
      font-weight: 700;
      transition: 0.25s ease;
      margin-bottom: 8px;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-green { background: linear-gradient(135deg,#22c55e,#16a34a); color: #fff; }
    .btn-blue { background: linear-gradient(135deg,#3b82f6,#2563eb); color: #fff; }
    .btn-dark { background: linear-gradient(135deg,#374151,#111827); color: #fff; }
    .status-preview {
      margin-top: 8px;
      font-size: 13px;
      color: #93c5fd;
      min-height: 20px;
    }
    .users { max-height: 220px; overflow: auto; }
    .user-item {
      padding: 8px 10px;
      border-radius: 12px;
      margin-bottom: 8px;
      background: rgba(255,255,255,0.05);
      font-size: 13px;
    }
    .main {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .topbar {
      padding: 16px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.03);
    }
    .topbar-title { font-weight: 800; }
    .topbar-sub { font-size: 12px; color: #cbd5e1; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 78%;
      padding: 12px;
      border-radius: 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.06);
      word-break: break-word;
    }
    .mine {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(34,197,94,.28), rgba(59,130,246,.18));
    }
    .meta {
      font-size: 11px;
      color: #cbd5e1;
      margin-bottom: 6px;
      font-weight: 700;
    }
    .message img {
      max-width: 100%;
      border-radius: 14px;
      margin-top: 8px;
    }
    .file-link {
      display: inline-block;
      margin-top: 8px;
      color: #93c5fd;
      text-decoration: none;
      font-weight: 700;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      padding: 12px 16px 0;
      flex-wrap: wrap;
    }
    .quick-btn {
      width: 52px; height: 52px; border: none; border-radius: 16px; cursor: pointer;
      color: white; font-size: 20px; font-weight: 700;
      box-shadow: 0 12px 24px rgba(0,0,0,.22);
    }
    .quick-green { background: linear-gradient(135deg,#22c55e,#16a34a); }
    .quick-blue { background: linear-gradient(135deg,#3b82f6,#2563eb); }
    .quick-dark { background: linear-gradient(135deg,#374151,#111827); }
    .composer {
      padding: 12px 16px 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: grid;
      grid-template-columns: 1fr 130px;
      gap: 12px;
      background: rgba(255,255,255,0.03);
    }
    textarea { resize: none; min-height: 58px; }
    .hint { font-size: 12px; color: #cbd5e1; line-height: 1.5; }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; height: auto; min-height: 95vh; }
      .sidebar { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.08); }
      .composer { grid-template-columns: 1fr; }
      .message { max-width: 92%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">IT-SHARWAN</div>

      <div class="card">
        <h3>Join Live Room</h3>
        <input id="nameInput" class="input" placeholder="Enter your name" />
        <input id="roomInput" class="input" placeholder="Enter room name (example: office1)" />
        <button id="joinBtn" class="btn btn-green">Join Room</button>
        <div class="hint">Same room name = same live chat on internet</div>
      </div>

      <div class="card">
        <h3>Status</h3>
        <input id="statusInput" class="input" placeholder="Set your status" />
        <button id="setStatusBtn" class="btn btn-blue">Update Status</button>
        <div id="statusPreview" class="status-preview">No status yet</div>
      </div>

      <div class="card">
        <h3>Online Users</h3>
        <div id="usersList" class="users"></div>
      </div>

      <div class="card">
        <h3>Room Tools</h3>
        <button id="copyRoomBtn" class="btn btn-dark">Copy Room Name</button>
        <button id="clearMyViewBtn" class="btn btn-dark">Clear My View</button>
        <div class="hint">Use Firebase Console rules for secure production.</div>
      </div>
    </aside>

    <section class="main">
      <div class="topbar">
        <div>
          <div class="topbar-title">IT-SHARWAN Live Internet Chat</div>
          <div id="roomLabel" class="topbar-sub">Not connected</div>
        </div>
        <div id="connectionState" class="topbar-sub">Firebase: Waiting...</div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="toolbar">
        <button class="quick-btn quick-green" id="focusTextBtn">T</button>
        <button class="quick-btn quick-blue" id="pickPhotoBtn">P</button>
        <button class="quick-btn quick-dark" id="pickFileBtn">F</button>
        <button class="quick-btn quick-green" id="openStatusBtn">S</button>
      </div>

      <div class="composer">
        <div>
          <textarea id="messageInput" placeholder="Type your message..."></textarea>
          <input id="photoInput" type="file" accept="image/*" hidden />
          <input id="fileInput" type="file" hidden />
        </div>
        <button id="sendBtn" class="btn btn-green">Send</button>
      </div>
    </section>
  </div>

  <!-- Firebase SDK (compat for simple single-file setup) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

  <script>
    // ============================
    // 1) PASTE YOUR FIREBASE CONFIG HERE
    // ============================
    const firebaseConfig = {
      apiKey: "PASTE_YOUR_API_KEY",
      authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://PASTE_YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "PASTE_YOUR_PROJECT",
      storageBucket: "PASTE_YOUR_PROJECT.appspot.com",
      messagingSenderId: "PASTE_YOUR_SENDER_ID",
      appId: "PASTE_YOUR_APP_ID"
    };

    // Basic validation so page doesn't crash before config is added
    const isConfigReady = firebaseConfig.apiKey && !firebaseConfig.apiKey.includes('PASTE_');

    const els = {
      nameInput: document.getElementById('nameInput'),
      roomInput: document.getElementById('roomInput'),
      joinBtn: document.getElementById('joinBtn'),
      statusInput: document.getElementById('statusInput'),
      setStatusBtn: document.getElementById('setStatusBtn'),
      statusPreview: document.getElementById('statusPreview'),
      usersList: document.getElementById('usersList'),
      copyRoomBtn: document.getElementById('copyRoomBtn'),
      clearMyViewBtn: document.getElementById('clearMyViewBtn'),
      roomLabel: document.getElementById('roomLabel'),
      connectionState: document.getElementById('connectionState'),
      messages: document.getElementById('messages'),
      messageInput: document.getElementById('messageInput'),
      photoInput: document.getElementById('photoInput'),
      fileInput: document.getElementById('fileInput'),
      sendBtn: document.getElementById('sendBtn'),
      focusTextBtn: document.getElementById('focusTextBtn'),
      pickPhotoBtn: document.getElementById('pickPhotoBtn'),
      pickFileBtn: document.getElementById('pickFileBtn'),
      openStatusBtn: document.getElementById('openStatusBtn')
    };

    let db = null;
    let storage = null;
    let roomName = '';
    let userName = '';
    let userId = 'u_' + Math.random().toString(36).slice(2, 10);
    let currentStatus = '';
    let messagesRef = null;
    let usersRef = null;

    if (isConfigReady) {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      storage = firebase.storage();
      els.connectionState.textContent = 'Firebase: Ready';
    } else {
      els.connectionState.textContent = 'Firebase: Add config first';
      addSystemMessage('Add your Firebase config in the code first.');
    }

    function safeRoom(value) {
      return value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '_');
    }

    function formatTime(ts) {
      const d = new Date(ts || Date.now());
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function addSystemMessage(text) {
      const div = document.createElement('div');
      div.className = 'message';
      div.innerHTML = `<div class="meta">SYSTEM • ${formatTime()}</div><div>${text}</div>`;
      els.messages.appendChild(div);
      els.messages.scrollTop = els.messages.scrollHeight;
    }

    function renderMessage(id, data) {
      const div = document.createElement('div');
      div.className = 'message' + (data.userId === userId ? ' mine' : '');

      let content = '';
      if (data.text) content += `<div>${escapeHtml(data.text)}</div>`;
      if (data.imageUrl) content += `<img src="${data.imageUrl}" alt="photo" />`;
      if (data.fileUrl) content += `<a class="file-link" href="${data.fileUrl}" target="_blank">📎 ${escapeHtml(data.fileName || 'Download File')}</a>`;

      div.innerHTML = `
        <div class="meta">${escapeHtml(data.userName || 'User')} ${data.status ? '• ' + escapeHtml(data.status) : ''} • ${formatTime(data.timestamp)}</div>
        ${content}
      `;
      els.messages.appendChild(div);
      els.messages.scrollTop = els.messages.scrollHeight;
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>\"']/g, m => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','\\':'&#92;'
      }[m]));
    }

    function renderUsers(snapshot) {
      els.usersList.innerHTML = '';
      const users = snapshot.val() || {};
      const values = Object.values(users);
      if (!values.length) {
        els.usersList.innerHTML = '<div class="user-item">No users online</div>';
        return;
      }
      values.forEach(u => {
        const div = document.createElement('div');
        div.className = 'user-item';
        div.textContent = `${u.name || 'User'}${u.status ? ' • ' + u.status : ''}`;
        els.usersList.appendChild(div);
      });
    }

    function joinRoom() {
      if (!isConfigReady) return alert('First add Firebase config in code.');
      userName = els.nameInput.value.trim();
      roomName = safeRoom(els.roomInput.value);

      if (!userName || !roomName) return alert('Enter name and room first.');

      els.roomLabel.textContent = `Connected Room: ${roomName}`;
      els.messages.innerHTML = '';

      messagesRef = db.ref(`rooms/${roomName}/messages`);
      usersRef = db.ref(`rooms/${roomName}/users`);

      messagesRef.off();
      usersRef.off();

      const myRef = usersRef.child(userId);
      myRef.set({ name: userName, status: currentStatus || '', joinedAt: firebase.database.ServerValue.TIMESTAMP });
      myRef.onDisconnect().remove();

      messagesRef.limitToLast(100).on('child_added', snap => renderMessage(snap.key, snap.val()));
      usersRef.on('value', renderUsers);

      addSystemMessage(`Joined room: ${roomName}`);
    }

    function updateStatus() {
      currentStatus = els.statusInput.value.trim();
      els.statusPreview.textContent = currentStatus || 'No status yet';
      if (usersRef && userName) {
        usersRef.child(userId).update({ status: currentStatus });
      }
    }

    async function sendTextMessage() {
      if (!messagesRef || !userName) return alert('Join room first.');
      const text = els.messageInput.value.trim();
      if (!text) return;
      await messagesRef.push({
        userId, userName, text, status: currentStatus || '', timestamp: Date.now()
      });
      els.messageInput.value = '';
    }

    async function uploadAndSend(file, type) {
      if (!messagesRef || !userName) return alert('Join room first.');
      if (!file) return;

      const max = type === 'image' ? 5 * 1024 * 1024 : 10 * 1024 * 1024;
      if (file.size > max) {
        return alert(type === 'image' ? 'Image max 5MB' : 'File max 10MB');
      }

      try {
        const ext = file.name.split('.').pop() || 'bin';
        const path = `uploads/${roomName}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
        const ref = storage.ref().child(path);
        els.connectionState.textContent = 'Uploading...';
        await ref.put(file);
        const url = await ref.getDownloadURL();

        const payload = {
          userId, userName, status: currentStatus || '', timestamp: Date.now()
        };
        if (type === 'image') payload.imageUrl = url;
        else {
          payload.fileUrl = url;
          payload.fileName = file.name;
        }
        await messagesRef.push(payload);
        els.connectionState.textContent = 'Firebase: Ready';
      } catch (e) {
        console.error(e);
        els.connectionState.textContent = 'Upload failed';
        alert('Upload failed. Check Firebase Storage rules.');
      }
    }

    // Events
    els.joinBtn.addEventListener('click', joinRoom);
    els.setStatusBtn.addEventListener('click', updateStatus);
    els.sendBtn.addEventListener('click', sendTextMessage);
    els.messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendTextMessage();
      }
    });

    els.photoInput.addEventListener('change', (e) => uploadAndSend(e.target.files[0], 'image'));
    els.fileInput.addEventListener('change', (e) => uploadAndSend(e.target.files[0], 'file'));

    els.focusTextBtn.addEventListener('click', () => els.messageInput.focus());
    els.pickPhotoBtn.addEventListener('click', () => els.photoInput.click());
    els.pickFileBtn.addEventListener('click', () => els.fileInput.click());
    els.openStatusBtn.addEventListener('click', () => els.statusInput.focus());

    els.copyRoomBtn.addEventListener('click', async () => {
      const value = els.roomInput.value.trim();
      if (!value) return alert('Enter room name first.');
      await navigator.clipboard.writeText(value);
      alert('Room name copied');
    });

    els.clearMyViewBtn.addEventListener('click', () => {
      els.messages.innerHTML = '';
      addSystemMessage('Your local view cleared (server chat still safe).');
    });
  </script>
</body>
</html>
